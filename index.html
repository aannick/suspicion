<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadaver Mansion</title>
<link rel="stylesheet" href="hero.css">
</head>
<body>

<section class="invitation-gate" id="invitation-gate">
  <div class="invitation-card">
    <img src="invitation.png" alt="An invitation from Mr. and Mrs. Cadaver" class="invitation-img">
    <button class="btn-accept" id="accept-btn" onclick="enterMansion()">Accept the Invitation</button>
  </div>
</section>

<section class="hero" id="hero">
  <div class="hero-photo" id="hero-photo"></div>
  <div class="hero-tint" id="hero-tint"></div>
  <div class="hero-rain" id="hero-rain"></div>
  <div class="hero-flash" id="hero-flash"></div>
  <div class="hero-vignette"></div>

  <div class="hero-content">
    <p class="eyebrow">Est. 1947</p>
    <h1>Suspicion</h1>
    <h2>The Interactive Mystery</h2>
    <div class="subtitle-wrap">
      <p class="subtitle subtitle-storm">Some houses remember everything.</p>
      <p class="subtitle subtitle-clear">All mystery, no gore.</p>
    </div>
    <a class="btn-enter" href="tickets.html">Visit Mr. Cadaver's Mansion</a>
  </div>
</section>

<audio id="rain-audio" src="sounds/rain.mp3" loop></audio>
<audio id="thunder-audio" src="sounds/thunder.mp3"></audio>
<audio id="chime-audio" src="sounds/wind_chimes.mp3" loop></audio>
<script src="hero.js"></script>
</body>
</html>
