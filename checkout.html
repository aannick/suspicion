<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Cadaver Mansion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shop.css">
</head>
<body>

  <header class="site">
    <a href="index.html" class="brand" style="text-decoration:none; color:inherit;">CADAVER<span> MANSION</span></a>
    <nav>
      <a href="tickets.html">Tours</a>
      <a href="cart.html" data-cart-count>Cart</a>
    </nav>
  </header>

  <main>
    <div class="eyebrow">Step 2 of 2</div>
    <h1>Checkout</h1>

    <div id="checkout-summary"></div>

    <form id="checkout-form" onsubmit="handleSubmit(event)">
      <h3 style="margin-top:2rem;">Contact</h3>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>

      <h3 style="margin-top:2rem;">Payment (demo only — not processed)</h3>
      <div class="field">
        <label for="card">Card number</label>
        <input type="text" id="card" placeholder="4242 4242 4242 4242" maxlength="19" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="expiry">Expiry</label>
          <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
        </div>
        <div class="field">
          <label for="cvc">CVC</label>
          <input type="text" id="cvc" placeholder="123" maxlength="4" required>
        </div>
      </div>

      <button type="submit" class="btn-primary" style="margin-top:1rem; width:100%;">Complete purchase</button>
    </form>

    <div class="notice">This is a demo storefront built for a school project. No real card information is collected, stored, or transmitted.</div>
  </main>

  <script src="shop.js"></script>
  <script>
    function renderSummary() {
      const items = cartWithDetails();
      const summary = document.getElementById("checkout-summary");

      if (items.length === 0) {
        summary.innerHTML = `<div class="empty-state">Your cart is empty. <a href="tickets.html">Browse tours →</a></div>`;
        document.getElementById("checkout-form").style.display = "none";
        return;
      }

      summary.innerHTML = `
        <div class="summary">
          ${items.map(item => `
            <div class="summary-row"><span>${item.name} × ${item.qty}</span><span>${formatPrice(item.price * item.qty)}</span></div>
          `).join("")}
          <div class="summary-row total"><span>Total</span><span>${formatPrice(cartTotal() * 1.1)}</span></div>
        </div>
      `;
    }

    function handleSubmit(e) {
      e.preventDefault();
      const orderNumber = generateOrderNumber();
      const name = document.getElementById("name").value;
      localStorage.setItem("lastOrder", JSON.stringify({
        orderNumber,
        name,
        items: cartWithDetails(),
        total: cartTotal() * 1.1
      }));
      localStorage.removeItem("manorCart");
      window.location.href = "confirmation.html";
    }

    renderSummary();
  </script>
</body>
</html>
