<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Cadaver Mansion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shop.css">
</head>
<body>

  <header class="site">
    <a href="index.html" class="brand" style="text-decoration:none; color:inherit;">CADAVER<span> MANSION</span></a>
    <nav>
      <a href="tickets.html">Tours</a>
      <a href="cart.html" data-cart-count>Cart</a>
    </nav>
  </header>

  <main>
    <div class="eyebrow">Step 1 of 2</div>
    <h1>Your cart</h1>

    <div id="cart-list"></div>
    <div id="cart-summary"></div>
  </main>

 <script src="shop.js"></script>
  <script>
    function renderCart() {
      const items = cartWithDetails();
      const list = document.getElementById("cart-list");
      const summary = document.getElementById("cart-summary");

      if (items.length === 0) {
        list.innerHTML = `<div class="empty-state">Your cart is empty. <a href="tickets.html">Reserve a seat →</a></div>`;
        summary.innerHTML = "";
        return;
      }

      list.innerHTML = items.map(item => `
        <div class="stub">
          <div class="stub-main">
            <h3>${item.name}</h3>
            <div class="stub-meta">${formatDate(item.date)} · ${item.time} · ${item.modeLabel}</div>
            <div class="stub-meta" style="margin-top:0.35rem;">${item.guestLabel}</div>
            <button class="btn-danger" style="margin-top:0.75rem; padding:0.4rem 0.7rem;" onclick="handleRemove('${item.bookingId}')">Remove</button>
          </div>
          <div class="stub-tear"></div>
          <div class="stub-side">
            <div class="stub-price">${formatPrice(item.price)}</div>
          </div>
        </div>
      `).join("");

      summary.innerHTML = `
        <div class="summary">
          <div class="summary-row"><span>Subtotal</span><span>${formatPrice(cartTotal())}</span></div>
          <div class="summary-row"><span>Service fee</span><span>${formatPrice(cartTotal() * 0.1)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatPrice(cartTotal() * 1.1)}</span></div>
        </div>
        <a href="checkout.html" class="btn btn-primary">Proceed to checkout →</a>
      `;
    }

    function handleRemove(bookingId) {
      removeFromCart(bookingId);
      renderCart();
      updateCartBadge();
    }

    renderCart();
  </script>
  <audio id="chime-audio" src="sounds/wind_chimes.mp3" loop></audio>
</body>
</html>
